services:
  portal-monitoramento:
    build: .
    container_name: portal-monitoramento
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      PORTAL_TITLE: "PAINEL DE SERVIÇOS"
      PORTAL_SUBTITLE: "6ª Companhia de Comunicações Mecanizada"
      REFRESH_SECONDS: "15"
      CHECK_TIMEOUT: "4"
      PING_TIMEOUT: "2"
      HOST_ROOT: "/host"
      FO_URL: "http://10.133.14.179/fo/"
      OTOBO_CLIENTE_URL: "http://10.133.14.179/otobo/customer.pl"
      OTOBO_ADMIN_URL: "http://10.133.14.179/admin"
      COCKPIT_URL: "https://10.133.14.179:9090"
      KUMA_URL: "http://10.133.14.179:3001"
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
