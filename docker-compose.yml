services:
  portal-monitoramento:
    build: .
    container_name: portal-monitoramento
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      PORTAL_TITLE: "PAINEL DE SERVIÇOS"
      PORTAL_SUBTITLE: "6ª Companhia de Comunicações Mecanizada"
      REFRESH_SECONDS: "15"
      CHECK_TIMEOUT: "4"
      PING_TIMEOUT: "2"
      HOST_ROOT: "/host"
      FO_URL: "http://10.133.212.222"
      OTOBO_CLIENTE_URL: "http://10.133.212.56/otobo/customer.pl"
      OTOBO_ADMIN_URL: "http://10.133.212.56/otobo/index.pl"
      COCKPIT_URL: "https://10.133.212.103:9090"
      ADMFO_URL: "http://10.133.212.222:9090"
      C27INTER_URL: "https://10.133.212.13:8000"
      C27CTA_URL: "https://10.166.66.168:8000"
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
