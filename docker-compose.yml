services:
  portal-monitoramento:
    build: .
    container_name: portal-monitoramento
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      PORTAL_TITLE: "PAINEL DE SERVIÇOS"
      PORTAL_SUBTITLE: "CODE WELTER"
      REFRESH_SECONDS: "15"
      CHECK_TIMEOUT: "4"
      PING_TIMEOUT: "2"
      HOST_ROOT: "/host"
      NXT_URL: "https://codewelter.cloud"
      vs_URL: "https://vs.codewelter.cloud"
      PRX_URL: "http://82.25.70.30:81"
      tool_URL: "https://tool.codewelter.cloud"
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
